name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pyproject.toml', 'backend/constraints.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"

      - name: Check version sync
        run: python ../scripts/check_version_sync.py

      - name: Check dependency sync
        run: python scripts/check_constraints_sync.py

      - name: Run tests
        run: python -m pytest tests/ -v

  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/renderer/package-lock.json

      - name: Install dependencies
        working-directory: src/renderer
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit renderer dependencies
        working-directory: src/renderer
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        working-directory: src/renderer
        run: npm run lint

      - name: TypeScript check
        working-directory: src/renderer
        run: npx tsc --noEmit

      - name: Build
        working-directory: src/renderer
        run: npm run build

      - name: Install Playwright browsers
        working-directory: src/renderer
        run: npx playwright install chromium

      # The E2E suite drives the real UI, and the UI talks to the backend through the
      # Vite dev proxy (vite.config: /api and /health -> 127.0.0.1:8001). Without a
      # backend listening there, 35 of the 147 tests fail on ECONNREFUSED — which is
      # what happened as soon as the audit step stopped failing first and the suite
      # actually got to run. PORT=8001 because that is the port the proxy targets.
      - name: Set up Python for the backend
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e .

      - name: Start backend for E2E
        working-directory: backend
        env:
          PORT: "8001"
        run: |
          python main.py > /tmp/backend.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8001/health || { echo "backend did not come up:"; cat /tmp/backend.log; exit 1; }

      - name: Run E2E tests
        working-directory: src/renderer
        run: npx playwright test --reporter=html

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: src/renderer/playwright-report/
          retention-days: 7
